name: Test, build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    # A push made by build-data.yml's own commit step (using the default
    # GITHUB_TOKEN) does NOT trigger other workflows -- that's a deliberate
    # GitHub Actions anti-loop rule. This picks it up explicitly instead of
    # requiring a manual re-run every time real data gets rebuilt.
    workflows: ['Build real game data (boundaries + WorldPop population)']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # Skip if this run was triggered by a failed/cancelled build-data.yml --
    # only a successful data rebuild should trigger a redeploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm test
      - run: npm run validate-data

      - name: Build (GitHub Pages base path)
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
